; ==============================================================================
; GestureLED - ESP32 PlatformIO Project Configuration
; Direct USB Serial Hand-Gesture Controller
; Board: Espressif ESP32 Dev Module (WROOM-32)
; ==============================================================================

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

; Serial baud rate matching firmware Serial.begin(115200)
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, direct

; Upload speed for rapid development
upload_speed = 460800
